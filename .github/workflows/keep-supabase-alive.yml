name: Keep Supabase Alive
on:
  schedule:
    # Runs every 3 days at noon UTC
    - cron: "0 12 */3 * *"
  workflow_dispatch: # Allows you to run it manually from the GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -X GET "${{ secrets.SUPABASE_API_URL }}" \
            -H "apikey: ${{ secrets.SUPABASE_API_KEY }}" \
            --fail --silent --show-error
